# LightCraft for Android: pushing a tag `android-v<version>`, or running this workflow by hand with that
# tag as input (the release then makes the tag on the chosen branch's commit), builds the arm64 APK and publishes it as a
# GitHub Release (a pre-release while the tag has a suffix such as -beta.1). See docs/android.md.
#
# Signing: with the repository secrets ANDROID_KEYSTORE_BASE64 (a .jks/.keystore, base64),
# ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS the APK is signed with that key, so later releases
# install as updates. Without them it is signed with a throwaway debug key made for the run.
name: Android release

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. android-v0.21.1-beta.1 (made on the chosen branch's commit if it doesn't exist)"
        required: true
        type: string

permissions: {}

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      - name: Rust for Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "LIGHTCRAFT_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key made for this run."
          fi

      - name: Build the APK
        env:
          LIGHTCRAFT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LIGHTCRAFT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # the app's updater looks for releases of this repository, newer than this version
          LIGHTCRAFT_UPDATE_REPO: ${{ github.repository }}
        run: |
          export LIGHTCRAFT_ANDROID_VERSION="${TAG#android-v}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          tools/android/build-apk.sh
          ls -la target/android/*.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#android-v}"
          APK=$(ls target/android/lightcraft-*-arm64.apk)
          ASSET="target/android/lightcraft-android-${VERSION}-arm64.apk"
          mv "$APK" "$ASSET"
          sha256sum "$ASSET" | sed 's|target/android/||' > "$ASSET.sha256"
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" $FLAGS \
              --target "$GITHUB_SHA" --title "LightCraft for Android ${VERSION}" --notes-file docs/android-release-notes.md
          fi
